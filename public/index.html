#result {

  top:10px;

  margin-bottom:18px;
  padding:20px;

  min-height:240px;

  border:1px solid #22c55e;
  border-radius:10px;

  color:#22ff88;
  font-family:"Courier New",monospace;

#result::-webkit-scrollbar {

}
